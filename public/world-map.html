<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Map: Unicorn Dash</title>
    <meta name="description" content="Pick a world and gallop through it: Meadow, Candy Canyon, Cloud Kingdom, Crystal Caves and Night Sky. No reading needed." />
    <link rel="canonical" href="https://jessicasogge.github.io/unicorn-dash/world-map.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unicorn Dash" />
    <meta property="og:title" content="World Map: Unicorn Dash" />
    <meta property="og:description" content="Pick a world and gallop through it: Meadow, Candy Canyon, Cloud Kingdom, Crystal Caves and Night Sky. No reading needed." />
    <meta property="og:url" content="https://jessicasogge.github.io/unicorn-dash/world-map.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/unicorn-dash/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Unicorn Dash start screen: a white unicorn with a pink mane leaping on a rainbow trail under the words Unicorn Dash" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="map">
      <!-- The sky: a few clouds, and the hills along the bottom -->
      <svg class="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <circle cx="200" cy="1080" r="460" fill="#8EDB6E" stroke="#2B2350" stroke-width="5" />
        <circle cx="1080" cy="1100" r="460" fill="#5BBE3F" stroke="#2B2350" stroke-width="5" />
        <g fill="#FFFFFF" opacity="0.85">
          <path d="M79 248 a19 19 0 0 1 7 -36 a28 28 0 0 1 53 -7 a22 22 0 0 1 41 15 a17 17 0 0 1 11 28 Z" />
          <path d="M1100 235 a20 20 0 0 1 8 -38 a30 30 0 0 1 56 -8 a24 24 0 0 1 44 16 a18 18 0 0 1 12 30 Z" />
          <path d="M560 135 a16 16 0 0 1 6 -30 a24 24 0 0 1 45 -6 a19 19 0 0 1 35 13 a14 14 0 0 1 10 23 Z" />
        </g>
      </svg>

      <nav class="map-bar">
        <!-- script.js adds her mane to this address, so she keeps it -->
        <a class="icon-btn home-btn" href="./index.html" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 3 L21 11 V21 H14.5 V15 H9.5 V21 H3 Z" /></svg>
        </a>
      </nav>

      <!-- The five worlds, all open: tap one and she goes there. -->
      <ol class="worlds">
        <li class="world here" data-world="meadow">
          <div class="perch"></div>
          <button class="island" type="button" aria-label="Meadow" aria-pressed="true">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g fill="#FF8FBF" stroke="#2B2350" stroke-width="2.5"><circle cx="24" cy="12" r="8" /><circle cx="35" cy="20" r="8" /><circle cx="31" cy="33" r="8" /><circle cx="17" cy="33" r="8" /><circle cx="13" cy="20" r="8" /></g>
              <circle cx="24" cy="23" r="7" fill="#FFC21A" stroke="#2B2350" stroke-width="2.5" />
            </svg>
          </button>
          <span class="world-name" aria-hidden="true">Meadow</span>
        </li>
        <li class="world" data-world="candy">
          <div class="perch"></div>
          <button class="island" type="button" aria-label="Candy Canyon" aria-pressed="false">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <rect x="22" y="26" width="4" height="20" rx="2" fill="#FFFFFF" stroke="#2B2350" stroke-width="2" />
              <circle cx="24" cy="18" r="15" fill="#FFFFFF" stroke="#2B2350" stroke-width="2.5" />
              <path d="M24 16 a2 2 0 0 1 2 2 a4 4 0 0 1 -4 4 a6 6 0 0 1 -6 -6 a8 8 0 0 1 8 -8 a10 10 0 0 1 10 10" fill="none" stroke="#FF5FA2" stroke-width="3.5" stroke-linecap="round" />
            </svg>
          </button>
          <span class="world-name" aria-hidden="true">Candy Canyon</span>
        </li>
        <li class="world" data-world="cloud">
          <div class="perch"></div>
          <button class="island" type="button" aria-label="Cloud Kingdom" aria-pressed="false">
            <svg viewBox="0 0 48 44" aria-hidden="true">
              <path d="M8 36 a7 7 0 0 1 2 -13.5 a10 10 0 0 1 19 -5 a8 8 0 0 1 12 6.5 a6.5 6.5 0 0 1 0 12 Z" fill="#FFFFFF" stroke="#2B2350" stroke-width="2.5" stroke-linejoin="round" />
            </svg>
          </button>
          <span class="world-name" aria-hidden="true">Cloud Kingdom</span>
        </li>
        <li class="world" data-world="crystal">
          <div class="perch"></div>
          <button class="island" type="button" aria-label="Crystal Caves" aria-pressed="false">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g stroke="#2B2350" stroke-width="2.5" stroke-linejoin="round">
                <path d="M24 4 L34 16 L24 44 L14 16 Z" fill="#7FE3FF" />
                <path d="M10 22 L16 28 L12 42 L6 30 Z" fill="#B9F1FF" />
                <path d="M38 22 L42 30 L36 42 L32 28 Z" fill="#B9F1FF" />
              </g>
            </svg>
          </button>
          <span class="world-name" aria-hidden="true">Crystal Caves</span>
        </li>
        <li class="world" data-world="night">
          <div class="perch"></div>
          <button class="island" type="button" aria-label="Night Sky" aria-pressed="false">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M30 6 a17 17 0 1 0 12 28 a14 14 0 0 1 -12 -28 Z" fill="#FFE58A" stroke="#2B2350" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M36 8 L37.5 12 L41.5 13.5 L37.5 15 L36 19 L34.5 15 L30.5 13.5 L34.5 12 Z" fill="#FFFFFF" />
            </svg>
          </button>
          <span class="world-name" aria-hidden="true">Night Sky</span>
        </li>
      </ol>
      <footer class="signature">jsogge 2026</footer>
    </main>
    <script type="module" src="./game/world-map.js"></script>
  </body>
</html>
