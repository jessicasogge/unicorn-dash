  <!-- Unicorn Dash app icon, for a phone's home screen: the game's unicorn
       leaping up on her rainbow trail, as on the start screen, on sky blue.
       Square and with no see-through parts, since phones round the corners
       themselves. The PNGs next to it (apple-touch-icon.png, icon-192.png,
       icon-512.png) are drawn from this. -->
